<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <title>Ripple Workspace</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/dashboard.css">
  <link rel="stylesheet" href="/details.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="Ripple Workspace">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-word"><strong>RIPPLE</strong><small>WORKSPACE</small></span>
    </a>
    <nav class="nav" aria-label="Điều hướng chính"></nav>
    <div class="sidebar-footer">
      <span class="profile-icon" aria-hidden="true">PM</span>
      <span><strong>Góc làm việc</strong><small>Workspace cá nhân</small></span>
      <span class="local-dot" title="Dữ liệu lưu trên máy" aria-label="Dữ liệu lưu trên máy"></span>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <span class="top-title" id="topTitle">Tổng quan</span>
      <div class="top-actions">
        <label class="search">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="Tìm dự án, ID, link…" aria-label="Tìm dự án, ID, link" autocomplete="off">
          <kbd aria-hidden="true">Ctrl K</kbd>
        </label>
        <button class="button primary" type="button" data-action="new-project" id="addProject">
          <span class="add-icon" aria-hidden="true"></span><span>Dự án mới</span>
        </button>
      </div>
    </header>
    <main id="content" tabindex="-1"><p class="muted">Đang tải workspace…</p></main>
    <footer class="page-footer"><span>RIPPLE WORKSPACE</span><span>Dữ liệu lưu trên máy này</span></footer>
  </div>
  <dialog id="editor" aria-labelledby="dialogTitle"></dialog>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <div id="notice" class="toast" role="status" hidden></div>
</body>
</html>
