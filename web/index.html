<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <title>Ripple Workspace</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/base.css">
  <link rel="stylesheet" href="/registry.css">
  <link rel="stylesheet" href="/details.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#projects" aria-label="Ripple Workspace">
      <img class="brand-mark" src="/assets/brand/logo-mark.svg" width="33" height="44" alt="">
      <span class="brand-word"><strong>RIPPLE</strong><small>WORKSPACE</small></span>
    </a>
    <nav class="nav" aria-label="Điều hướng chính">
      <a href="#projects" data-page="projects" aria-current="page">Dự án</a>
      <a href="#backup" data-page="backup">Sao lưu</a>
    </nav>
  </header>
  <main id="workspace">
    <div id="registryHeader" hidden>
      <header class="page-heading registry-heading">
        <div><h1>Thông tin dự án</h1><p>Tra cứu ID và cấu hình phát hành theo từng game.</p></div>
        <button class="button primary" type="button" data-action="new-project" id="addProject">
          <span class="add-icon" aria-hidden="true"></span><span>Thêm dự án</span>
        </button>
      </header>
      <div class="registry-toolbar">
        <label class="search">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="Tìm tên game, ID, keystore, link…" aria-label="Tìm tên game, ID, keystore, link" autocomplete="off">
          <kbd aria-hidden="true">Ctrl K</kbd>
        </label>
        <label class="select-wrap status-filter">
          <select id="statusFilter" aria-label="Lọc theo trạng thái"><option value="">Tất cả trạng thái</option></select>
        </label>
      </div>
    </div>
    <div id="content"><p class="muted">Đang tải workspace…</p></div>
  </main>
  <footer class="page-footer"><span id="storageStatus">Dữ liệu lưu trên máy này</span></footer>
  <dialog id="editor" aria-labelledby="dialogTitle"></dialog>
  <input id="importFile" type="file" accept=".json,application/json" hidden>
  <div id="notice" class="toast" role="status" hidden></div>
</body>
</html>
